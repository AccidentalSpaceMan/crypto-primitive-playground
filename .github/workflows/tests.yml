# GitHub Actions: run the test suite automatically.
# GitHub reads every .yml file in .github/workflows/ and runs it on its own servers.

name: Tests

# When to run: on every push to main, and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

# The workflow only needs to read the code, so don't give it write access.
permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    # A "matrix" runs the same job several times with different settings,
    # so we know the project works on several Python versions and on Windows.
    strategy:
      fail-fast: false # keep running the other combinations if one fails
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v
